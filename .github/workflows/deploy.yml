name: CI/CD Pipeline - Laravel Production Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: Testing

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test_db
      DB_USERNAME: root
      DB_PASSWORD: password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Configure Database
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Build Assets
        run: npm run build

      - name: Run Laravel Tests
        run: ./vendor/bin/pest

      - name: Test Success Notification
        if: success()
        run: echo "✅ Tests passed successfully!"

      - name: Test Failure Notification
        if: failure()
        run: echo "❌ Tests failed! Deployment will not proceed."

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to application directory
            cd ${{ secrets.APP_PATH }}
            
            # Get the current branch name
            BRANCH="${{ github.ref_name }}"
            
            # Pull latest changes
            echo "📦 Pulling latest code from Git (branch: $BRANCH)..."
            git pull origin $BRANCH
            
            # Install/update composer dependencies
            echo "📚 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            echo "🗄️  Running database migrations..."
            php artisan migrate --force
            
            # Clear and optimize caches
            echo "🔄 Optimizing Laravel caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Set proper permissions
            echo "🔐 Setting file permissions..."
            chmod -R 775 storage bootstrap/cache
            
            # Restart services if needed (uncomment if you use queue workers or other services)
            # php artisan queue:restart
            # php artisan octane:reload
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment Success Notification
        if: success()
        run: echo "✅ Deployment to production completed successfully!"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment failed! Please check the logs and server status."
          exit 1
