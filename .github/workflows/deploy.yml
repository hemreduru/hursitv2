name: CI/CD - Laravel Simple Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test_db
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, mysql, gd, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: composer install --no-interaction

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: php artisan migrate --force

      - run: npm run build

      - run: ./vendor/bin/pest

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH (server handles git pull)
        run: |
          ssh -o StrictHostKeyChecking=no hursitv2@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd /home/hursitv2/htdocs/www.hursit.me

            echo "📦 Pulling latest code"
            git pull

            echo "📚 Composer install"
            composer install --no-dev --no-scripts --optimize-autoloader

            echo "🗄️ Migrate"
            php artisan migrate --force

            echo "⚡ Optimize"
            php artisan optimize

            echo "🔄 Queue restart"
            php artisan queue:restart

            echo "✅ DEPLOY FINISHED"
          EOF
