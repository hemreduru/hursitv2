name: Deploy Production

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == github.repository
      )
    environment:
      name: Production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main

            if [ -n "${{ secrets.FLUX_USERNAME }}" ] && [ -n "${{ secrets.FLUX_LICENSE_KEY }}" ]; then
              composer config --global http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
            fi

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            php artisan package:discover --ansi

            if command -v npm >/dev/null 2>&1; then
              npm ci
              npm run build
            else
              echo "npm command not found on remote server."
              exit 1
            fi

            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
